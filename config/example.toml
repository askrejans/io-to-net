# io-to-net configuration
# Copy to /etc/io-to-net/config.toml and edit as needed.

# Global log level: trace | debug | info | warn | error
log_level = "info"

# ─── HTTP Admin API ──────────────────────────────────────────────
[http_api]
enabled = true
listen = "0.0.0.0:9106"

# Optional Bearer token authentication
# [http_api.auth]
# token = "change-me-in-production"

# Optional per-second rate limit
# rate_limit_per_second = 20

# ─── Prometheus Metrics ──────────────────────────────────────────
[metrics]
enabled = true
listen = "0.0.0.0:9105"

# ─── Bridges ─────────────────────────────────────────────────────
# Each [[bridges]] block creates one IO→TCP bridge.

# ── Example 1: Serial ECU over TCP ───────────────────────────────
[[bridges]]
name = "ecu"
max_clients = 10
mode = "mirror"     # mirror | exclusive | proxy
read_only = false   # true = clients cannot send data to device
auto_restart = true
# frame_mode controls how data is packaged before sending to TCP clients.
# Omit (or set "none") for raw streaming — client handles its own framing.
# Options: none | length_prefix | line | null_terminated
# frame_mode = "none"        # default — raw byte stream
# frame_mode = "line"        # emit one complete line per \n (NMEA, AT commands)
# frame_mode = "null_terminated"  # emit one packet per 0x00 byte (COBS streams)
# frame_mode = "length_prefix"    # prepend [u16 len][data] (I2C, SPI sensor reads)

[bridges.source]
type = "serial"
port = "/dev/ttyUSB0"
baud = 115200
data_bits = 8
parity = "none"     # none | odd | even
stop_bits = 1
flow_control = "none" # none | software | hardware

[bridges.transport]
type = "tcp"
listen = "[::]:9000"
write_timeout_ms = 5000

# ── Example 2: Bluetooth OBD-II adapter ──────────────────────────
# [[bridges]]
# name = "obd"
# read_only = true
# auto_restart = true
#
# [bridges.source]
# type = "bluetooth"
# device = "AA:BB:CC:DD:EE:FF"
# # Optional BLE GATT characteristic UUID
# # characteristic_uuid = "0000ffe1-0000-1000-8000-00805f9b34fb"
#
# [bridges.transport]
# type = "tcp"
# listen = "[::]:9001"

# ── Example 3: I2C IMU — MPU-6050 (Linux only) ───────────────────
# Exposes raw accelerometer + gyroscope data (14 bytes) over TCP.
#
# Key I2C options:
#   read_reg   — register address written before each read to set the
#                device's internal pointer. Required for most sensors.
#                MPU-6050 accel/gyro data starts at 0x3B.
#   init_bytes — list of write transactions sent once on open.
#                MPU-6050 powers up in sleep mode; [0x6B, 0x00] wakes it.
#                Each inner array is a single I2C write transaction.
#
# Clients always connect even if the hardware is offline or being
# retried — the port stays open and data flows once the device is ready.
#
# [[bridges]]
# name = "imu"
# read_only = true
# auto_restart = true
# frame_mode = "length_prefix"  # prepend each 14-byte read with a 2-byte length
#                                # client: read 2 bytes → u16 len, then read len bytes
#
# [bridges.source]
# type = "i2c"
# bus = "/dev/i2c-1"
# address = 0x68          # MPU-6050 default I2C address
# read_len = 14           # accel XYZ (6) + temp (2) + gyro XYZ (6)
# poll_ms = 10            # 100 Hz polling
# read_reg = 0x3B         # ACCEL_XOUT_H — start of accel data block
# init_bytes = [[0x6B, 0x00]]  # PWR_MGMT_1 = 0x00: wake from sleep
#
# [bridges.transport]
# type = "tcp"
# listen = "[::]:9002"

# ── Example 3b: I2C pressure sensor — BMP280 (Linux only) ────────
# BMP280 at 0x77, read 8 raw bytes from 0xF7 after config.
# Two init writes: set oversampling mode, then set standby time.
#
# [[bridges]]
# name = "baro"
# read_only = true
# auto_restart = true
# frame_mode = "length_prefix"
#
# [bridges.source]
# type = "i2c"
# bus = "/dev/i2c-1"
# address = 0x77
# read_len = 8
# poll_ms = 50
# read_reg = 0xF7
# init_bytes = [
#   [0xF4, 0x2F],   # ctrl_meas: temp×1, press×1, normal mode
#   [0xF5, 0xA0],   # config: standby 1s, filter off
# ]
#
# [bridges.transport]
# type = "tcp"
# listen = "[::]:9003"

# ── Example 4: CAN bus (Linux only) ──────────────────────────────
# [[bridges]]
# name = "can0"
# read_only = true
#
# [bridges.source]
# type = "canbus"
# interface = "can0"
#
# [bridges.transport]
# type = "tcp"
# listen = "[::]:9003"

# ── Example 5: TLS-encrypted TCP bridge ──────────────────────────
# [[bridges]]
# name = "ecu-tls"
# auto_restart = true
#
# [bridges.source]
# type = "serial"
# port = "/dev/ttyUSB1"
# baud = 115200
#
# [bridges.transport]
# type = "tls"
# listen = "[::]:9443"
# cert = "/etc/io-to-net/cert.pem"
# key = "/etc/io-to-net/key.pem"

# ── Example 6: WebSocket bridge ──────────────────────────────────
# [[bridges]]
# name = "ecu-ws"
#
# [bridges.source]
# type = "serial"
# port = "/dev/ttyUSB0"
# baud = 115200
#
# [bridges.transport]
# type = "web_socket"
# listen = "[::]:9080"

# ── Example 7: PTY (pseudo-terminal, Unix only) ───────────────────
# [[bridges]]
# name = "pty-bridge"
#
# [bridges.source]
# type = "pty"
# symlink = "/tmp/io-to-net-pty"
#
# [bridges.transport]
# type = "tcp"
# listen = "[::]:9004"

# ── Example 8: 1-Wire temperature sensor (Linux only) ────────────
# [[bridges]]
# name = "temp"
# read_only = true
#
# [bridges.source]
# type = "onewire"
# device = "/sys/bus/w1/devices/28-000000000000"
# poll_ms = 1000
#
# [bridges.transport]
# type = "tcp"
# listen = "[::]:9005"
