# Cross.toml – configuration for `cross` (https://github.com/cross-rs/cross)
#
# Serial ports are enumerated through sysfs (serialport without libudev), so
# the only native dependency is libdbus for BLE sources (btleplug → BlueZ).
# Build with `--no-default-features` to drop BLE and libdbus entirely.

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update -qq && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64 && apt-get update -qq && apt-get install -y --no-install-recommends libdbus-1-dev:arm64 pkg-config",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS=1", "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig"]
