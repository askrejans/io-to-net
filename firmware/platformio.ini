; io-to-net firmware — standalone Wi-Fi TCP bridge node for ESP32 / ESP8266
; Configure bridges in src/config.h and credentials in src/secrets.h
; (copy src/secrets.h.example) before building.
;
; Build:    pio run -e esp32dev
; Upload:   pio run -e esp32dev --target upload
; Monitor:  pio device monitor --baud 115200

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
build_flags = -D FIRMWARE_VERSION=\"0.2.0\"

; ─── ESP32 (classic) ─────────────────────────────────────────────
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev

; ─── ESP32-S3 ────────────────────────────────────────────────────
[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D UART_RX_PIN=18 -D UART_TX_PIN=17 -D STATUS_LED_PIN=-1

; ─── ESP8266 ─────────────────────────────────────────────────────
; The data UART is UART0 (GPIO3 RX / GPIO1 TX); debug goes to UART1 (TX-only GPIO2).
[env:esp8266dev]
platform = espressif8266@4.2.1
board = nodemcuv2
