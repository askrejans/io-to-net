; io-to-net firmware — standalone TCP bridge for ESP32 / ESP8266
; Configure bridges in src/config.h before building.
;
; Build:    pio run -e esp32dev
; Upload:   pio run -e esp32dev --target upload
; Monitor:  pio device monitor --baud 115200

[env]
lib_ldf_mode = deep+
monitor_speed = 115200
framework = arduino

; ─── ESP32 ───────────────────────────────────────────────────────
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    -D ARDUINO_ARCH_ESP32
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
lib_deps =
    ; WiFi, TCP already built-in for ESP32 Arduino
    Wire
    SPI

; ─── ESP8266 ─────────────────────────────────────────────────────
[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
build_flags =
    -D ARDUINO_ARCH_ESP8266
lib_deps =
    Wire
    SPI
