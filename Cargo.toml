[package]
name = "io-to-net"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["askrejans"]
description = "Transparent edge bridge: serial, CAN, I2C, GPIO, BLE and more to TCP, TLS and WebSocket clients"
license = "GPL-3.0-only"
repository = "https://github.com/askrejans/io-to-net"
readme = "README.md"
keywords = ["serial", "bridge", "tcp", "can", "telemetry"]
categories = ["network-programming", "hardware-support", "command-line-utilities"]

[[bin]]
name = "io-to-net"
path = "src/main.rs"

[features]
default = ["bluetooth"]
# BLE GATT sources (btleplug; needs D-Bus on Linux)
bluetooth = ["dep:btleplug"]

[dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# sysfs enumeration on Linux (USB IDs included), so no libudev dependency
serialport = { version = "4.10.1", default-features = false }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14.10"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }

ratatui = "0.30.2"

btleplug = { version = "0.13.5", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term", "fs", "signal", "poll"] }

[target.'cfg(target_os = "linux")'.dependencies]
i2cdev = "0.6.2"
gpio-cdev = "0.6.0"
socketcan = "4.0.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
